version: "3.9"

services:

  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul-init:
    build: ./consul-init
    container_name: consul-init
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"

  hazelcast-1:
    image: hazelcast/hazelcast:5.3
    container_name: hazelcast-1
    environment:
      - HZ_CLUSTERNAME=dev
    ports:
      - "5701:5701"
    depends_on:
      consul:
        condition: service_healthy

  hazelcast-2:
    image: hazelcast/hazelcast:5.3
    container_name: hazelcast-2
    environment:
      - HZ_CLUSTERNAME=dev
    ports:
      - "5702:5701"
    depends_on:
      consul:
        condition: service_healthy

  hazelcast-3:
    image: hazelcast/hazelcast:5.3
    container_name: hazelcast-3
    environment:
      - HZ_CLUSTERNAME=dev
    ports:
      - "5703:5701"
    depends_on:
      consul:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: counterdb
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  logging-service-1:
    build: ./logging-service
    container_name: logging-service-1
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=logging-service-1
      - SERVICE_ADDRESS=logging-service-1
      - SERVICE_PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  logging-service-2:
    build: ./logging-service
    container_name: logging-service-2
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=logging-service-2
      - SERVICE_ADDRESS=logging-service-2
      - SERVICE_PORT=8001
    ports:
      - "8011:8001"
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  logging-service-3:
    build: ./logging-service
    container_name: logging-service-3
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=logging-service-3
      - SERVICE_ADDRESS=logging-service-3
      - SERVICE_PORT=8001
    ports:
      - "8021:8001"
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  counter-service:
    build: ./counter-service
    container_name: counter-service
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=counterdb
      - CONSUL_HOST=consul
      - SERVICE_ID=counter-service-1
      - SERVICE_ADDRESS=counter-service
      - SERVICE_PORT=8002
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  facade-service:
    build: ./facade-service
    container_name: facade-service
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=facade-service-1
      - SERVICE_ADDRESS=facade-service
      - SERVICE_PORT=8000
      - TIMEOUT_SEC=2.0
    ports:
      - "8000:8000"
    depends_on:
      consul-init:
        condition: service_completed_successfully
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started
      counter-service:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
